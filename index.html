<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>My page</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet"><style id="app-style">
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --ink:#e9e9e9; --muted:#8d939c;
  --pad:clamp(12px,2vw,40px);
  --gap:clamp(16px,2.2vw,56px);
  --maxw:2600px;
  --tbh:clamp(40px,2.2vw + 22px,62px);
  --ui:"Segoe UI","Open Sans",Tahoma,system-ui,-apple-system,sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); background:#000; overflow-y:scroll}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; background:#000; color:var(--ink); font-family:var(--ui); -webkit-text-size-adjust:100%}
button,input{font:inherit}
[hidden]{display:none !important}

/* owner-only controls */
body:not(.owner) .owner-only{display:none !important}
.viewing .edit-only{display:none !important}


/* ===== Aurora background ===== */
.bg{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; background:#0a5f66}
.vhs{position:absolute; left:0; top:0; width:100%; height:100%; display:block}
.bg.nogl{background:radial-gradient(60% 45% at 8% 100%,rgba(225,220,70,.6),transparent 70%),radial-gradient(45% 30% at 85% 98%,rgba(80,230,255,.55),transparent 70%),radial-gradient(70% 55% at 10% 15%,rgba(20,140,90,.55),transparent 70%),linear-gradient(160deg,#0a7a70,#0b5a66 45%,#2a8fb8)}
.bg.nogl .vhs{display:none}

/* ===== Vista-style glass toolbar ===== */
.bar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:25;
  background:linear-gradient(to bottom,rgba(90,130,190,.62) 0%,rgba(45,80,135,.62) 48%,rgba(15,35,75,.7) 50%,rgba(30,65,115,.66) 100%);
  -webkit-backdrop-filter:blur(10px) saturate(1.4); backdrop-filter:blur(10px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 0 rgba(0,0,0,.5);
  font-family:var(--ui); font-size:14px; color:#fff; text-shadow:0 0 6px rgba(0,0,0,.55);
}
.bar-in{max-width:var(--maxw); margin:0 auto; padding:9px var(--pad); display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center}
.group{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.spacer{flex:1}

.btn,.tools button{
  font-family:var(--ui); color:#000; text-shadow:none; cursor:pointer;
  border:1px solid #707070; border-radius:3px;
  background:linear-gradient(to bottom,#f6f6f6 0%,#ececec 45%,#dcdcdc 50%,#cdcdcd 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.85);
}
.btn{padding:5px 14px}
.btn.small{padding:3px 12px; font-size:13px}
.btn:hover:not(:disabled),.tools button:hover:not(:disabled){
  border-color:#3c7fb1; background:linear-gradient(to bottom,#eaf6fd 0%,#d9f0fc 45%,#bee6fd 50%,#a7d9f5 100%);
}
.btn:active:not(:disabled),.tools button:active:not(:disabled){
  border-color:#2c628b; background:linear-gradient(to bottom,#c4e5f6 0%,#98d1ef 45%,#68b3db 50%,#7fc2e8 100%);
  box-shadow:inset 1px 1px 2px rgba(0,0,0,.3);
}
.btn.primary{
  border-color:#2c628b; background:linear-gradient(to bottom,#dff1fc 0%,#b4dcf5 45%,#8ac6ee 50%,#a8dafa 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.75),0 0 4px rgba(120,200,255,.6);
}
.btn.primary:hover:not(:disabled){background:linear-gradient(to bottom,#eaf8ff 0%,#c8e9fb 45%,#9fd5f4 50%,#bde8ff 100%)}
.btn:disabled,.tools button:disabled{
  color:#838383; border-color:#adb2b5; cursor:default;
  background:linear-gradient(to bottom,#f4f4f4,#f4f4f4); box-shadow:none; opacity:.8;
}
.btn:focus-visible,.tools button:focus-visible,.cap:focus-visible,.rb:focus-visible,.vb:focus-visible{
  outline:1px dotted #000; outline-offset:-4px; box-shadow:inset 0 0 0 2px #7ec0ee;
}
input:focus-visible,[contenteditable]:focus-visible{outline:1px solid #5aa8dd; outline-offset:2px}

.song{color:#d6e4f5; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
input[type=range]{width:90px; accent-color:#7cc4ee}
.status{color:#d6e4f5; font-size:13px}
.status.warn{color:#ffb3aa}
.status.dirty{color:#ffd58a}
.hidden-input{display:none}
.plinput{
  width:clamp(180px,22vw,360px); padding:5px 8px; font:13px var(--ui); color:#000; background:#fff;
  border:1px solid #707070; border-radius:3px; box-shadow:inset 1px 1px 2px rgba(0,0,0,.2);
}

/* ===== page ===== */
main{position:relative; z-index:1; max-width:var(--maxw); margin:0 auto; padding:clamp(18px,3vw,56px) var(--pad) calc(var(--tbh) + clamp(28px,4vw,64px))}
h1{
  font-size:clamp(28px,2.4vw + 14px,68px); line-height:1.15; font-weight:300;
  margin:0 0 clamp(18px,2.5vw,44px); letter-spacing:-.01em; overflow-wrap:anywhere; color:#fff;
  text-shadow:0 0 .5em rgba(120,200,255,.55),0 0 1.4em rgba(120,160,255,.35),0 1px 2px rgba(0,0,0,.7);
}
.cols{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--gap); align-items:start}
.col{min-width:0}
.col-head{
  display:none; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:18px;
  font-family:var(--ui); font-size:13px; color:#c9d3e6; text-shadow:0 1px 3px #000;
}
.editing .col-head{display:flex}
.col-head .name{margin-right:auto}
.block{position:relative; margin:0 0 clamp(20px,2.2vw,44px)}

[contenteditable]{outline:none; border-radius:3px}
[contenteditable]:empty::before{content:attr(data-ph); color:#8a8a8a; pointer-events:none}
.viewing [contenteditable]:empty{display:none}
.viewing .np-text:empty{display:block}

.tools{display:none; flex-wrap:wrap; gap:6px; margin-top:8px}
.editing .tools{display:flex}
.tools button{font-size:12px; padding:2px 10px}

.empty{display:none; color:#c9d3e6; text-shadow:0 1px 3px #000; text-align:center; padding:0 0 24px; font-family:var(--ui); font-size:15px}
.empty.show{display:block}

/* ===== Vista Aero window frame ===== */
.vwin{
  position:relative; font-family:var(--ui); font-size:clamp(12px,.3vw + 9px,17px);
  background:linear-gradient(to bottom,rgba(205,225,248,.52) 0%,rgba(150,186,234,.42) 42%,rgba(118,158,214,.42) 100%);
  -webkit-backdrop-filter:blur(10px) saturate(1.6); backdrop-filter:blur(10px) saturate(1.6);
  border:1px solid rgba(0,0,0,.62); border-radius:.6em .6em 0 0; padding:0 .45em .45em;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.48),0 .3em 1.4em rgba(0,0,0,.45); color:#000;
}
.vwin::before{
  content:""; position:absolute; left:0; right:0; top:0; height:5em; pointer-events:none; border-radius:inherit;
  background:linear-gradient(115deg,rgba(255,255,255,.38) 0 20%,rgba(255,255,255,0) 20.2% 44%,rgba(255,255,255,.16) 44.2% 60%,rgba(255,255,255,0) 60.2%);
}
.vtitle{position:relative; height:2.3em; display:flex; align-items:center; gap:.5em; padding:0 9em 0 .3em; text-shadow:0 0 .6em #fff,0 0 .25em #fff}
.vtitle .ico{width:1.35em; height:1.35em; flex:none; display:block}
.vtitle .ico svg{width:100%; height:100%; display:block}
.vtext{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.vtext .ttl{display:inline; min-width:2em}
.caps{position:absolute; top:-1px; right:.45em; display:flex; z-index:2}
.cap{
  height:1.75em; width:2.7em; padding:0; display:grid; place-items:center; cursor:pointer;
  border:1px solid rgba(0,0,0,.7); border-top:0; margin-left:-1px;
  background:linear-gradient(to bottom,#e9f1fb 0%,#c3d6ef 48%,#9db9de 52%,#bcd2ee 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.55); color:#1b2f4d;
}
.cap:first-child{border-bottom-left-radius:.35em}
.cap svg{width:.8em; height:.8em; fill:currentColor; stroke:currentColor}
.cap:hover{background:linear-gradient(to bottom,#f6fbff 0%,#d6e8fb 48%,#b4d4f5 52%,#d3e6fa 100%)}
.cap.close{width:4.3em; border-bottom-right-radius:.35em; color:#fff; background:linear-gradient(to bottom,#e9a79c 0%,#d9715f 45%,#c1311e 52%,#d9604b 100%)}
.cap.close svg{stroke:#fff; filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
.cap.close:hover{background:linear-gradient(to bottom,#f6c4bb 0%,#ec8d7c 45%,#d94a35 52%,#ee7a65 100%)}
.viewing .block .cap.close{display:none}
.vbody{background:#f0f0f0; border:1px solid rgba(0,0,0,.75); box-shadow:0 0 0 1px rgba(255,255,255,.4); overflow:hidden}
.vwin.mini .vbody{display:none}
.vwin.mini{padding-bottom:0}
.menu{
  display:flex; flex-wrap:wrap; gap:0 1em; padding:.25em .7em; font-size:.92em; color:#000;
  background:linear-gradient(#fdfdfd,#e8ebf0); border-bottom:1px solid #b6bdc9; user-select:none; cursor:default;
}

.vwin.max{
  position:fixed; z-index:20; left:8px; right:8px; bottom:calc(var(--tbh) + env(safe-area-inset-bottom,0px) + 8px);
  top:calc(var(--barh,0px) + env(safe-area-inset-top,0px) + 8px);
  display:flex; flex-direction:column;
}
.vwin.max .vbody{flex:1; min-height:0; display:flex; flex-direction:column}
.vwin.max .np-text{flex:1; overflow:auto}
.vwin.max .pv-area{flex:1; min-height:0}
.vwin.max .pv-area img{max-height:100%}
.vwin.max .vlc-screen{aspect-ratio:auto; flex:1; min-height:0}

/* Notepad */
.np-text{
  background:#fff; color:#000; padding:.5em .6em;
  font-family:"Lucida Console",Consolas,"Courier New",monospace; font-size:1.15em; line-height:1.4;
  white-space:pre-wrap; overflow-wrap:anywhere; min-height:9em;
}

/* Photo Viewer */
.pv-area{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5em;
  padding:.8em; min-height:8em; overflow:hidden; background:linear-gradient(#f7f9fc,#dbe3ee);
}
.pv-area img{display:block; max-width:100%; max-height:80vh; object-fit:contain}
.pv-area.actual{overflow:auto; align-items:flex-start; justify-content:flex-start}
.pv-area.actual img{max-width:none; max-height:none}
.pv-cap{font-size:.9em; color:#4a5568; text-align:center; min-height:1.2em; max-width:100%; overflow-wrap:anywhere}
.pv-bar{
  display:flex; align-items:center; justify-content:space-between; gap:.5em; padding:.45em .7em;
  background:linear-gradient(#eef3fa 0%,#d0dcee 48%,#bccce4 52%,#d3e0f1 100%); border-top:1px solid #8fa4c4;
}
.pv-bar .side{flex:1; display:flex; gap:.4em; align-items:center}
.pv-bar .side.end{justify-content:flex-end}
.viewing .pv-bar .side.end{visibility:hidden}
.pv-bar .mid{display:flex; gap:.6em; align-items:center}
.rb{
  width:2.3em; height:2.3em; border-radius:50%; padding:0; cursor:pointer; display:grid; place-items:center;
  border:1px solid #5d7ca6; color:#27456f;
  background:radial-gradient(circle at 50% 15%,#fff 0,#eaf1fb 38%,#b7cbe7 58%,#d5e3f6 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 1px 2px rgba(0,0,0,.25);
}
.rb svg{width:56%; height:56%; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.rb:hover:not(:disabled){border-color:#2f6fb5; background:radial-gradient(circle at 50% 15%,#fff 0,#e3f2ff 38%,#8fc4f2 58%,#c4e1fb 100%)}
.rb:disabled{opacity:.45; cursor:default}
.rb.big{width:3.1em; height:3.1em; border-color:#1d5fa8; color:#fff; background:radial-gradient(circle at 50% 15%,#e6f4ff 0,#8cc8f6 36%,#1f78d4 58%,#58aef0 100%)}
.rb.big svg{fill:currentColor; stroke:none}
.rb.red{border-color:#8a2c20; color:#fff; background:radial-gradient(circle at 50% 15%,#ffe3de 0,#f0a095 36%,#c43a28 58%,#e57565 100%)}

/* VLC */
.vlc-screen{position:relative; background:#000; aspect-ratio:16/9; display:grid; place-items:center; overflow:hidden; cursor:pointer}
.vlc-screen video{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000}
.vlc-screen .cone{width:20%; max-width:150px; min-width:48px; opacity:.95; position:relative}
.vlc-screen.started .cone{display:none}
.vlc-msg{position:absolute; left:0; right:0; bottom:.8em; text-align:center; color:#aaa; font-size:.9em; padding:0 1em}
.vlc-ctl{background:linear-gradient(#f6f6f6,#d9d9d9); border-top:1px solid #9a9a9a; padding:.4em .6em .5em; display:flex; flex-direction:column; gap:.4em}
.vlc-row{display:flex; align-items:center; gap:.45em}
.vlc-row .t{font-size:.85em; color:#222; min-width:2.9em; font-variant-numeric:tabular-nums}
.vlc-row .t.r{text-align:right}
.vlc-row input[type=range]{flex:1; min-width:0; width:auto; accent-color:#f58a1f}
.vlc-row .vol{flex:none; width:8em}
.vb{
  width:2.2em; height:1.9em; padding:0; display:grid; place-items:center; cursor:pointer;
  border:1px solid #8a8a8a; border-radius:3px; color:#222;
  background:linear-gradient(#fcfcfc,#e2e2e2 48%,#d1d1d1 52%,#e6e6e6); box-shadow:inset 0 0 0 1px rgba(255,255,255,.7);
}
.vb svg{width:58%; height:58%; display:block; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.vb svg .f{fill:currentColor; stroke:none}
.vb:hover{border-color:#f58a1f; background:linear-gradient(#fff4e6,#ffd9a8 48%,#ffc680 52%,#ffe0b8)}
.vb.on{border-color:#d86f00; background:linear-gradient(#ffd9a8,#ffb866 50%,#ffa63a 52%,#ffc680)}
.vlc-row .pct{font-size:.85em; min-width:2.8em; text-align:right; color:#222}

/* Visualizer window */
.vis{position:fixed; z-index:30; right:12px; top:calc(var(--barh,0px) + env(safe-area-inset-top,0px) + 12px); width:clamp(190px,17vw,400px)}
.vis .vtitle{padding-right:6.6em; cursor:move; touch-action:none}
.vis .vbody{background:#000}
.vis canvas{display:block; width:100%; aspect-ratio:16/10; background:#000}


/* ===== Vista taskbar ===== */
.taskbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  height:calc(var(--tbh) + env(safe-area-inset-bottom,0px));
  padding:0 .5em env(safe-area-inset-bottom,0px) .3em;
  display:flex; align-items:center; gap:.5em;
  font-family:var(--ui); font-size:clamp(12px,.25vw + 10px,16px); color:#fff; text-shadow:0 0 .5em rgba(0,0,0,.8);
  background:
    linear-gradient(to bottom,rgba(255,255,255,.22) 0,rgba(255,255,255,.05) 46%,rgba(255,255,255,0) 50%),
    linear-gradient(to bottom,rgba(70,82,104,.78) 0%,rgba(26,34,52,.82) 48%,rgba(6,11,22,.9) 52%,rgba(22,38,66,.86) 100%);
  -webkit-backdrop-filter:blur(12px) saturate(1.5); backdrop-filter:blur(12px) saturate(1.5);
  border-top:1px solid rgba(255,255,255,.42);
  box-shadow:0 -1px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.16);
}
.orb{
  flex:none; width:var(--tbh); height:var(--tbh); margin-top:calc(var(--tbh)*-.2); padding:0; cursor:pointer;
  display:grid; place-items:center; border-radius:50%; color:#fff; border:1px solid rgba(0,20,60,.9);
  background:
    radial-gradient(circle at 50% 14%,rgba(255,255,255,.9) 0,rgba(255,255,255,.18) 34%,rgba(255,255,255,0) 36%),
    radial-gradient(circle at 50% 118%,#8fe0ff 0,rgba(90,190,255,.4) 45%,rgba(0,0,0,0) 70%),
    radial-gradient(circle at 50% 50%,#2d6bc4 0,#12408f 55%,#081f55 100%);
  box-shadow:0 0 .8em rgba(110,190,255,.55),inset 0 0 .5em rgba(255,255,255,.35),0 1px 3px rgba(0,0,0,.7);
}
.orb svg{width:52%; height:52%; display:block; filter:drop-shadow(0 0 3px rgba(0,30,80,.8))}
.orb:hover{box-shadow:0 0 1.2em rgba(150,220,255,.9),inset 0 0 .6em rgba(255,255,255,.55),0 1px 3px rgba(0,0,0,.7)}
.tb-items{display:flex; gap:.35em; align-items:center; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none}
.tb-items::-webkit-scrollbar{display:none}
.tbtn{
  flex:0 1 11em; min-width:0; height:calc(var(--tbh)*.78); display:flex; align-items:center; gap:.5em; padding:0 .8em;
  cursor:pointer; color:#fff; font:inherit; text-shadow:inherit;
  border:1px solid rgba(255,255,255,.28); border-radius:.3em;
  background:linear-gradient(to bottom,rgba(255,255,255,.26) 0%,rgba(255,255,255,.08) 48%,rgba(0,0,0,.14) 52%,rgba(255,255,255,.1) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.5);
}
.tbtn svg{width:1.35em; height:1.35em; flex:none; display:block; stroke:currentColor; fill:none; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round}
.tbtn svg .f{fill:currentColor; stroke:none}
.tbtn span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tbtn:hover{border-color:rgba(160,220,255,.75); background:linear-gradient(to bottom,rgba(190,230,255,.4) 0%,rgba(120,190,245,.2) 48%,rgba(40,110,190,.24) 52%,rgba(140,205,250,.26) 100%)}
.tbtn.active{
  border-color:rgba(170,225,255,.85);
  background:linear-gradient(to bottom,rgba(150,210,255,.55) 0%,rgba(90,160,235,.38) 48%,rgba(40,100,190,.4) 52%,rgba(100,170,240,.42) 100%);
  box-shadow:inset 0 0 .8em rgba(190,235,255,.45),0 0 .8em rgba(90,170,255,.4);
}
.tbtn:focus-visible,.ti:focus-visible,.orb:focus-visible{outline:1px dotted #fff; outline-offset:2px}
.tray{display:flex; align-items:center; gap:.45em; flex:none; padding-left:.6em; border-left:1px solid rgba(255,255,255,.18)}
.ti{width:calc(var(--tbh)*.6); height:calc(var(--tbh)*.6); padding:0; cursor:pointer; display:grid; place-items:center; color:#fff; border:1px solid transparent; border-radius:.3em; background:transparent}
.ti:hover:not(:disabled){border-color:rgba(160,220,255,.55); background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.06))}
.ti:disabled{opacity:.4; cursor:default}
.ti svg{width:62%; height:62%; display:block; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round}
.ti svg .f{fill:currentColor; stroke:none}
.tray input[type=range]{width:clamp(56px,6vw,110px); accent-color:#7cc4ee}
.clock{padding:0 .3em; min-width:4.6em; text-align:center; font-size:.95em; cursor:default; white-space:nowrap}

/* ===== Contact (mail) window ===== */
.mail-wrap{max-width:min(100%,820px); margin:0 auto clamp(24px,3vw,56px)}
.mail-tb{display:flex; align-items:center; gap:.8em; padding:.5em .8em; background:linear-gradient(#fcfdff,#e3e8f0); border-bottom:1px solid #b6bdc9}
.mail-send{
  display:flex; align-items:center; gap:.5em; padding:.35em .95em .35em .6em; cursor:pointer; font:inherit; font-weight:600; color:#10315e;
  border:1px solid #7b93b8; border-radius:.3em;
  background:linear-gradient(#fdfeff,#dfe9f7 48%,#c7d8ef 52%,#e2edfb); box-shadow:inset 0 0 0 1px rgba(255,255,255,.8);
}
.mail-send svg{width:1.6em; height:1.6em; display:block}
.mail-send:hover:not(:disabled){border-color:#3c7fb1; background:linear-gradient(#f0f9ff,#cfe9fc 48%,#acd9f6 52%,#c9eaff)}
.mail-send:disabled{opacity:.55; cursor:default}
.mail-fields{background:#fff; padding:.3em .8em; border-bottom:1px solid #b6bdc9}
.mail-row{display:flex; align-items:center; gap:.7em; padding:.2em 0; border-bottom:1px solid #eef0f4}
.mail-row:last-child{border-bottom:0}
.mail-row label,.mail-row .lbl{width:6.5em; flex:none; color:#333; text-align:right}
.mail-row input,.mail-row .to{flex:1; min-width:0; font:inherit; color:#000; background:transparent; border:0; padding:.3em .35em; outline:none; border-radius:2px}
.mail-row .to{min-height:1.6em; overflow-wrap:anywhere}
.mail-row input:focus{background:#eaf4ff; box-shadow:inset 0 0 0 1px #7eb4ea}
.mail-body{display:block; width:100%; min-height:clamp(9em,14vw,20em); resize:vertical; border:0; outline:none; padding:.7em .9em; font:inherit; font-size:1.05em; line-height:1.5; color:#000; background:#fff; border-radius:0}
.mail-foot{display:flex; flex-wrap:wrap; align-items:center; gap:.6em; padding:.5em .9em; min-height:2.6em; background:linear-gradient(#f6f7fa,#e6e9ef); border-top:1px solid #b6bdc9; font-size:.92em; color:#222}
.mail-foot .warn{color:#a02317}

/* ===== private-editor gate ===== */
.gate{display:none; position:fixed; inset:0; z-index:90; place-items:center; padding:24px}
body.is-gate .gate{display:grid}
body.is-gate main,body.is-gate .taskbar,body.is-pending main,body.is-pending .taskbar{visibility:hidden}
.gate-box{
  max-width:30em; padding:1.4em 1.8em; font-family:var(--ui); color:#fff; text-align:center; text-shadow:0 0 .5em rgba(0,0,0,.7);
  background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.05)),rgba(10,30,50,.55);
  border:1px solid rgba(255,255,255,.4); border-radius:.6em; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);

.gate-box h2{margin:0 0 .5em; font-weight:300; font-size:1.6em}
.gate-box p{margin:0; line-height:1.5}
.pv-area.missing::after{content:'This picture isn’t stored in this browser'; color:#5a6678; font-size:.95em; padding:2em 1em; text-align:center}

/* ===== free-form stage ===== */
.stage{position:relative; width:100%; --s:1}
.fblock{
  position:absolute; font-size:calc(16px*var(--s));
  left:calc(var(--x)*var(--s)*1px); top:calc(var(--y)*var(--s)*1px); width:calc(var(--w)*var(--s)*1px); z-index:var(--z);
}
.fblock.has-max{z-index:1000 !important}
.fblock .vwin{font-size:1em}
.fblock .pv-area img{max-height:none}
.editing .fblock .vtitle{cursor:move; touch-action:none}
.editing .fblock .ttl{cursor:text}
.grip{
  display:none; position:absolute; right:0; bottom:0; width:1.7em; height:1.7em; z-index:5; cursor:nwse-resize; touch-action:none;
  background:linear-gradient(135deg,transparent 0 48%,rgba(255,255,255,.9) 48% 54%,transparent 54% 64%,rgba(255,255,255,.9) 64% 70%,transparent 70% 80%,rgba(255,255,255,.9) 80% 86%,transparent 86%);

}
.editing .grip{display:block}
@media (max-width:759px){

        tb.removeEventListener('pointercancel', up);
        try{ tb.releasePointerCapture(ev.pointerId); }catch(err){}
        if(moved){ touch(); layoutStage(); }
        else if(hitTitle){
          var tt = win.querySelector('.ttl');
          if(tt){
            tt.focus();
            try{ var r = document.createRange(); r.selectNodeContents(tt); r.collapse(false);
                 var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); }catch(err){}
          }

      tb.addEventListener('pointerup', up);

  function attachGrip(wrap, b){
    var g = el('div', 'grip');
    g.title = 'Drag to resize';
    g.addEventListener('pointerdown', function(e){
      if(isStack()) return;
      e.preventDefault(); e.stopPropagation();
      bringFront(b, wrap);
      var sx = e.clientX, sy = e.clientY, ow = b.w, s = curScale;
      var np = wrap.querySelector('.np-text');
      var oh = b.h || (np ? np.offsetHeight / s : 0);
      try{ g.setPointerCapture(e.pointerId); }catch(err){}
      function mv(ev){
        b.w = Math.max(220, Math.min(STAGE_W - b.x, ow + (ev.clientX - sx) / s));
        if(np) b.h = Math.max(80, Math.min(2400, oh + (ev.clientY - sy) / s));
        applyPos(wrap, b);
      }
      function up(ev){
        g.removeEventListener('pointermove', mv);
        g.removeEventListener('pointerup', up);
        g.removeEventListener('pointercancel', up);
        try{ g.releasePointerCapture(ev.pointerId); }catch(err){}
        touch(); layoutStage();

      g.addEventListener('pointermove', mv);
      g.addEventListener('pointerup', up);
      g.addEventListener('pointercancel', up);

  function rotateImage(b, dir){
    mediaUrl(b).then(function(u){
      if(!u) return;
      var im = new Image();
      im.onload = function(){
        if(!im.naturalWidth) return;
        var cv = document.createElement('canvas');
        cv.width = im.naturalHeight; cv.height = im.naturalWidth;
        var x = cv.getContext('2d');
        x.translate(cv.width / 2, cv.height / 2);
        x.rotate(dir * Math.PI / 2);
        x.drawImage(im, -im.naturalWidth / 2, -im.naturalHeight / 2);
        var type = b.mime === 'image/png' ? 'image/png' : 'image/jpeg';
        cv.toBlob(function(blob){
          if(!blob) return;
          storeMedia(blob).then(function(mid){
            b.mid = mid; b.mime = type; b.size = blob.size; delete b.src;
            touch(); render();
          }).catch(function(){ setStatus('Couldn’t store the rotated picture.', true); });
        }, type, 0.92);
      };
      im.src = u;
    });
  }

  /* ---------- music player: playlist engine (Web Audio) + analyser ---------- */
  // Each track is decoded to a buffer. A single track loops sample-accurately with no gap; with several
  // tracks the next one is decoded ahead of time so the change is quick, and the list wraps round forever.
  var actx = null, analyser = null, gainNode = null, bufSrc = null, curBuf = null;
  var cur = 0, volume = 0.3, userPaused = false, gestureArmed = false, loadToken = 0;
  var startedAt = 0, offsetSec = 0;

  function ensureCtx(){
    if(actx) return true;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      actx = new AC();
      analyser = actx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.78;
      gainNode = actx.createGain();
      gainNode.gain.value = volume;
      analyser.connect(gainNode);
      gainNode.connect(actx.destination);

    capability_disabled: 'Saving isn’t available in this view.'
  };
  // "Save changes" keeps the layout, text and titles in the editor itself (pictures, videos and songs stay in this browser)
  $('pubBtn').addEventListener('click', function(){
    if(!artifactApi || !dirty) return;
    $('pubBtn').disabled = true;
    setStatus('Saving…', false, true);
    var html;
    try{ html = buildDoc(state); }catch(e){ setStatus('Could not build the page.', true); $('pubBtn').disabled = false; return; }
    try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
    dirty = false;
    artifactApi.publish(html).then(function(){
      setStatus('Saved', false);
    }).catch(function(err){
      dirty = true; updateMeters(); saveDraft();
      setStatus(ERR[err && err.code] || 'Could not save. Try again.', true);
    });
  });
  var revertArmed = false, revertTimer;
  $('revertBtn').addEventListener('click', function(){
    var b = $('revertBtn');
    if(!revertArmed){
      revertArmed = true; b.textContent = 'Click again to discard';
      revertTimer = setTimeout(function(){ revertArmed = false; b.textContent = 'Revert'; }, 4000);
      return;
    }
    clearTimeout(revertTimer);
    try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
    dirty = false;
    window.location.reload();
  });
  window.addEventListener('beforeunload', function(e){
    if(isOwner && dirty){ e.preventDefault(); e.returnValue = ''; }
  });

  /* ---------- export the site (for GitHub Pages) ---------- */
  var downloadsApi = null;
  var EXT = { 'image/jpeg':'jpg', 'image/png':'png', 'image/gif':'gif', 'image/webp':'webp', 'image/svg+xml':'svg',
              'video/mp4':'mp4', 'video/webm':'webm', 'video/quicktime':'mov',
              'audio/mpeg':'mp3', 'audio/mp3':'mp3', 'audio/mp4':'m4a', 'audio/x-m4a':'m4a', 'audio/aac':'aac', 'audio/wav':'wav', 'audio/x-wav':'wav',
              'audio/ogg':'ogg', 'audio/flac':'flac', 'audio/webm':'weba' };
  function extFor(item){
    var e = EXT[item.mime || ''];
    if(!e){ var m = /\.([A-Za-z0-9]{2,5})$/.exec(item.name || ''); e = m ? m[1].toLowerCase() : 'bin'; }
    return e;
  }

  // a minimal ZIP writer (files stored as they are; photos, music and video are already compressed)
  var CRC_T = (function(){
    var t = new Uint32Array(256);
    for(var n = 0; n < 256; n++){ var c = n; for(var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
    return t;
  })();
  function crc32(u8){
    var c = 0xFFFFFFFF;
    for(var i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function makeZip(files, onProgress){
    var parts = [], central = [], offset = 0, enc = new TextEncoder();
    var d = new Date();
    var dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    var dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    var chain = Promise.resolve();
    files.forEach(function(f, i){
      chain = chain.then(function(){
        var blob = f.blob || new Blob([f.text], { type: 'text/plain' });
        return blob.arrayBuffer().then(function(buf){
          var u8 = new Uint8Array(buf), crc = crc32(u8), nameB = enc.encode(f.name), size = u8.length;
          var h = new DataView(new ArrayBuffer(30));
          h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
          h.setUint16(10, dosTime, true); h.setUint16(12, dosDate, true); h.setUint32(14, crc, true);
          h.setUint32(18, size, true); h.setUint32(22, size, true); h.setUint16(26, nameB.length, true); h.setUint16(28, 0, true);
          parts.push(h.buffer, nameB, blob);
          central.push({ nameB: nameB, crc: crc, size: size, offset: offset });
          offset += 30 + nameB.length + size;
          if(onProgress) onProgress(i + 1, files.length);
        });
      });
    });
    return chain.then(function(){
      var cdStart = offset, cdSize = 0;
      central.forEach(function(c){
        var h = new DataView(new ArrayBuffer(46));
        h.setUint32(0, 0x02014b50, true); h.setUint16(4, 20, true); h.setUint16(6, 20, true); h.setUint16(8, 0x0800, true); h.setUint16(10, 0, true);
        h.setUint16(12, dosTime, true); h.setUint16(14, dosDate, true); h.setUint32(16, c.crc, true);
        h.setUint32(20, c.size, true); h.setUint32(24, c.size, true); h.setUint16(28, c.nameB.length, true);
        h.setUint16(30, 0, true); h.setUint16(32, 0, true); h.setUint16(34, 0, true); h.setUint16(36, 0, true);
        h.setUint32(38, 0, true); h.setUint32(42, c.offset, true);
        parts.push(h.buffer, c.nameB);
        cdSize += 46 + c.nameB.length;
      });
      var e = new DataView(new ArrayBuffer(22));
      e.setUint32(0, 0x06054b50, true); e.setUint16(4, 0, true); e.setUint16(6, 0, true);
      e.setUint16(8, central.length, true); e.setUint16(10, central.length, true);
      e.setUint32(12, cdSize, true); e.setUint32(16, cdStart, true); e.setUint16(20, 0, true);
      parts.push(e.buffer);
      return new Blob(parts, { type: 'application/zip' });
    });
  }
  // reads back zips made by makeZip (stored entries only)
  function readZip(buf){
    var dv = new DataView(buf), u8 = new Uint8Array(buf), e = -1;
    for(var i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--){ if(dv.getUint32(i, true) === 0x06054b50){ e = i; break; } }
    if(e < 0) throw new Error('notzip');
    var count = dv.getUint16(e + 10, true), p = dv.getUint32(e + 16, true), out = {}, dec = new TextDecoder();
    for(var n = 0; n < count; n++){
      if(dv.getUint32(p, true) !== 0x02014b50) throw new Error('badzip');
      var method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
      var nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
      var name = dec.decode(u8.subarray(p + 46, p + 46 + nl));
      if(method !== 0) throw new Error('compressed');
      var start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
      out[name] = new Blob([buf.slice(start, start + csize)]);
      p += 46 + nl + xl + cl;
    }
    return out;
  }

  var README = [
    'Your site is ready for GitHub Pages.',
    '',
    '1. Unzip this file.',
    '2. Create a repository on GitHub (a public one is fine).',
    '3. Upload everything from the unzipped folder (index.html, the assets folder and .nojekyll) to the repository.',
    '   On github.com: Add file > Upload files, then drag the contents in.',
    '   GitHub\'s website accepts up to 25 MB per file in the browser and 100 MB per file through git or GitHub Desktop.',
    '4. In the repository open Settings > Pages, set Source to "Deploy from a branch", pick the main branch and the / (root) folder, and Save.',
    '5. After a minute or two the site is live at https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/',
    '',
    'To update the site later, export again and upload the new files over the old ones.',
    ''
  ].join('\n');

  var exporting = false;
  function exportSite(){
    if(!downloadsApi){ setStatus('Saving files isn’t available in this view.', true); return; }
    if(exporting) return;
    exporting = true;
    $('exportBtn').disabled = true;
    setStatus('Building your site…', false, true);
    var items = [];
    var st = { static: true, title: state.title, pageTitles: state.pageTitles, contactEmail: state.contactEmail, blocks: [], tracks: [] };
    function outItem(it, list){
      var o = {}; Object.keys(it).forEach(function(k){ if(k !== 'src') o[k] = it[k]; });
      o.file = 'assets/' + mediaKey(it) + '.' + extFor(it);
      items.push({ from: it, file: o.file });
      list.push(o);
    }
    state.blocks.forEach(function(b){
      if(b.type === 'text'){ var o = {}; Object.keys(b).forEach(function(k){ o[k] = b[k]; }); st.blocks.push(o); }
      else outItem(b, st.blocks);
    });
    state.tracks.forEach(function(t){ outItem(t, st.tracks); });

    var files = [
      { name: 'index.html', text: buildDoc(st) },
      { name: '.nojekyll', text: '\n' },
      { name: 'README.txt', text: README }
    ];
    var chain = Promise.resolve();
    items.forEach(function(it, i){
      chain = chain.then(function(){
        setStatus('Collecting files… ' + (i + 1) + ' of ' + items.length, false, true);
        return mediaBlob(it.from).then(function(b){ files.push({ name: it.file, blob: b }); });
      });
    });
    chain.then(function(){
      return makeZip(files, function(n, total){ setStatus('Packing… ' + n + ' of ' + total, false, true); });
    }).then(function(zip){
      setStatus('Choose where to save it…', false, true);
      return downloadsApi.save({ filename: 'my-site.zip', data: zip });
    }).then(function(){
      setStatus('Saved my-site.zip. Unzip it and upload the contents to your GitHub repository (README.txt explains the steps).', false, true);
    }).catch(function(err){
      var c = err && err.code;
      setStatus(c === 'declined' ? 'Export cancelled.'
        : (c === 'rejected_extension' || c === 'extension_not_enabled') ? 'This view can’t save .zip files.'
        : (err && err.message === 'missing') ? 'Some media isn’t stored in this browser, so the site can’t be built from here. Import a backup first.'
        : 'Couldn’t build the site. Try again.', true);
    }).then(function(){ exporting = false; $('exportBtn').disabled = false; });
  }
  $('exportBtn').addEventListener('click', exportSite);

  // restore from a zip made by "Export site"
  var importArmed = false, importTimer;
  $('importBtn').addEventListener('click', function(){
    var b = $('importBtn');
    if(!importArmed){
      importArmed = true; b.textContent = 'Replace everything? Click again';
      importTimer = setTimeout(function(){ importArmed = false; b.textContent = 'Import backup'; }, 4000);
      return;
    }
    clearTimeout(importTimer); importArmed = false; b.textContent = 'Import backup';
    $('importFile').click();
  });
  $('importFile').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!f) return;
    setStatus('Reading backup…', false, true);
    f.arrayBuffer().then(function(buf){
      var z = readZip(buf);
      if(!z['index.html']) throw new Error('noindex');
      return z['index.html'].text().then(function(html){
        var m = html.match(/<script id="page-data" type="application\/json">([\s\S]*?)<\/script>/);
        if(!m) throw new Error('nodata');
        var st = JSON.parse(m[1]);
        var jobs = [];
        (st.blocks || []).concat(st.tracks || []).forEach(function(it){
          if(it.file && z[it.file]){
            var blob = new Blob([z[it.file]], { type: it.mime || '' });
            var mid = it.mid || newMid();
            jobs.push(mPut(mid, blob).then(function(){ it.mid = mid; it.size = blob.size; }));
          }
          delete it.file;
        });
        return Promise.all(jobs).then(function(){ return st; });
      });
    }).then(function(st){
      delete st.static;
      state = st; normalize();
      dirty = true; saveDraft();
      resetPlayback(true);
      render(); updateMeters();
      setStatus('Backup restored. Press “Save changes” to keep it.', false);
    }).catch(function(err){
      setStatus(err && err.message === 'compressed' ? 'That zip was re-compressed by another tool. Import the file exactly as it was exported.' : 'Couldn’t read that backup.', true);
    });
  });

  /* ---------- owner setup ---------- */
  // content from the earlier version of this page arrives inside the page itself; move it into browser storage
  function migrateSeed(){
    var items = state.blocks.filter(function(b){ return b.src; }).concat(state.tracks.filter(function(t){ return t.src; }));
    if(!items.length) return Promise.resolve(false);
    var failed = false;
    return items.reduce(function(p, it){
      return p.then(function(){
        var blob = dataUriToBlob(it.src), mid = newMid();
        return mPut(mid, blob).then(function(){ it.mid = mid; it.mime = blob.type; it.size = blob.size; delete it.src; });
      }).catch(function(){ failed = true; });
    }, Promise.resolve()).then(function(){
      if(failed) setStatus('Some media couldn’t be moved into browser storage and stays inside the page for now.', true);
      return true;
    });
  }
  // forget stored media that nothing points at any more (only when there's no unsaved draft)
  function gcMedia(){
    mOpen().then(function(db){
      var req = db.transaction(MEDIA_STORE).objectStore(MEDIA_STORE).getAllKeys();
      req.onsuccess = function(){
        var used = {};
        state.blocks.concat(state.tracks).forEach(function(it){ if(it.mid) used[it.mid] = 1; });
        (req.result || []).forEach(function(k){ if(!used[k]) mDel(k).catch(function(){}); });
      };
    }).catch(function(){});
  }

  function becomeOwner(api){
    artifactApi = api;
    isOwner = true;
    editing = true;
    setGate('');
    var draft = null;
    try{ draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); }catch(e){}
    if(draft && Array.isArray(draft.blocks)){
      var prevSig = trackSig(state);
      state = draft; normalize();
      dirty = true;
      setStatus('Restored your unsaved draft.', false);
      if(trackSig(state) !== prevSig) resetPlayback(!userPaused);
      render(); updateMeters();
      return;
    }
    render(); updateMeters();
    migrateSeed().then(function(moved){
      if(moved){
        dirty = true; saveDraft();
        render(); updateMeters();
        setStatus('Moved your pictures, videos and songs into this browser’s storage. Press “Save changes” to keep the layout.', false);
      } else {
        gcMedia();
      }
    });
  }
  function detectOwner(){
    if(STATIC) return;
    if(!window.claude || typeof window.claude.use !== 'function'){ setGate('is-gate'); return; }
    var api = null;
    Promise.all([window.claude.use('user'), window.claude.use('artifact'), window.claude.use('downloads')]).then(function(r){
      var u = r[0]; api = r[1]; downloadsApi = r[2] || null;
      if(!u || !api) return false;
      return Promise.resolve(u.isOwner());
    }).then(function(ok){
      if(ok) becomeOwner(api); else setGate('is-gate');
    }).catch(function(){ setGate('is-gate'); });
  }

  /* ---------- start (visitor view first; owner tools light up if confirmed) ---------- */
  render();
  updateMeters();
  detectOwner();
  startAutoplay();
})();
</script></body></html>
